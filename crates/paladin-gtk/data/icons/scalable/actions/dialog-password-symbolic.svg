<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    SPDX-License-Identifier: AGPL-3.0-or-later

    Paladin row placeholder icon: a stylized lock used when a row's
    `AccountSummary.icon_hint` is `None`, empty, or unresolved against the
    system icon theme. Shipped inside the gresource bundle at
    `/org/tamx/Paladin/Gui/icons/scalable/actions/dialog-password-symbolic.svg`
    so the `IconTheme` lookup keyed by `icon_resolution::PLACEHOLDER_ICON_NAME`
    ("dialog-password-symbolic") resolves identically in native and Flatpak
    builds even when the sandboxed runtime omits the system symbolic.

    This comment sits inside the <svg> root on purpose: content sniffers
    (GdkPixbuf's loader signature, shared-mime-info magic) only recognize
    the file as an SVG when <svg appears within the first 256 bytes.
    Pinned by tests/icon_assets_logic.rs::
    shipped_svgs_keep_root_tag_within_sniff_window.

    The path uses `currentColor` so GTK's symbolic-icon machinery can recolor
    it against the active foreground per `gtk::STYLE_PROVIDER_PRIORITY_APPLICATION`.
  -->
  <path fill="currentColor" d="M8 1c-2.2 0-4 1.8-4 4v2H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-1V5c0-2.2-1.8-4-4-4zm0 2c1.1 0 2 0.9 2 2v2H6V5c0-1.1 0.9-2 2-2zm0 7c0.6 0 1 0.4 1 1 0 0.4-0.2 0.7-0.5 0.9V13a0.5 0.5 0 0 1-1 0v-1.1A1 1 0 0 1 8 10z"/>
</svg>
