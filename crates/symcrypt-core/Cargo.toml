[package]
name = "symcrypt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core crypto, file format, and streaming for symcrypt"

[lints]
workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
cbc = "0.1"
chacha20poly1305 = "0.10.1"
getrandom = "0.4.2"
hmac = "0.13"
pbkdf2 = "0.13.0"
scrypt = "0.12.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
tempfile = "3.27.0"
