# Release: pushing a version tag (v*) re-runs the full test gate, builds the
# .deb/.rpm packages, and publishes them — with a SHA256SUMS file — to a
# GitHub release for that tag.
#
# The tag must match the workspace version in Cargo.toml (tag v1.2.3 <->
# version = "1.2.3"); the job fails fast otherwise, so a mistagged push can
# never ship artifacts whose embedded version disagrees with the tag.
#
# Supply-chain notes: same pinning policy as ci.yml — third-party action by
# commit SHA, nfpm by version + SHA-256 checksum, runner image pinned.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version} (expected v${version})"
            exit 1
          fi

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev build-essential pkg-config

      - name: Install the stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "package"

      - name: Install nfpm (pinned, checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97"
        run: |
          gh release download --repo goreleaser/nfpm "v${NFPM_VERSION}" \
            --pattern "nfpm_${NFPM_VERSION}_amd64.deb" --output nfpm.deb
          echo "${NFPM_SHA256}  nfpm.deb" | sha256sum --check
          sudo dpkg -i nfpm.deb
          rm nfpm.deb

      - name: Run the CI gate (fmt-check, lint, test)
        run: make ci

      - name: Run the end-to-end suite
        run: make e2e

      - name: Build the .deb and .rpm packages
        run: make package

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber dist/*
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
              --title "paladin ${GITHUB_REF_NAME}" dist/*
          fi
