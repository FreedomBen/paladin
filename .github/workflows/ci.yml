# Continuous integration: the full gate (`make ci`), the end-to-end CLI suite,
# and a packaging build that uploads the .deb/.rpm files as workflow artifacts.
#
# Supply-chain notes: the third-party action (Swatinem/rust-cache) is pinned to
# a full commit SHA; GitHub-owned actions/* are pinned to major tags; nfpm is
# pinned by version and verified against its published SHA-256 checksum before
# installing. ubuntu-24.04 is pinned explicitly because paladin-gtk needs
# GTK >= 4.10 and libadwaita >= 1.5 (24.04 ships 4.14 / 1.5).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev build-essential pkg-config

      - name: Install the stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "debug"

      - name: Run the CI gate (fmt-check, lint, test)
        run: make ci

  e2e:
    name: End-to-end CLI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "debug"

      # The suite is plain Ruby minitest (both preinstalled on the runner).
      - name: Run the end-to-end suite
        run: make e2e

  package:
    name: Package .deb + .rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev build-essential pkg-config

      - name: Install the stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "package"

      - name: Install nfpm (pinned, checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97"
        run: |
          gh release download --repo goreleaser/nfpm "v${NFPM_VERSION}" \
            --pattern "nfpm_${NFPM_VERSION}_amd64.deb" --output nfpm.deb
          echo "${NFPM_SHA256}  nfpm.deb" | sha256sum --check
          sudo dpkg -i nfpm.deb
          rm nfpm.deb

      - name: Build the .deb and .rpm packages
        run: make package

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
