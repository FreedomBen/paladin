# nfpm config — paladin-gtk desktop package (.deb / .rpm).
#
# Built via `make package` (or package-deb / package-rpm), which exports the
# VERSION and ARCH variables referenced below. To run nfpm by hand, set them
# yourself, e.g.:
#   VERSION=0.1.0 ARCH=amd64 nfpm package -f packaging/nfpm-gtk.yaml -p deb -t dist
#
# nfpm reference: https://nfpm.goreleaser.com
name: paladin-gtk
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: "Benjamin Porter <FreedomBen@users.noreply.github.com>"
vendor: "Benjamin Porter"
homepage: "https://github.com/FreedomBen/paladin"
license: "MIT OR Apache-2.0"
description: |
  Simple, safe symmetric file encryption (GTK4/libadwaita desktop app).

  A native desktop front-end over the same paladin core as the CLI:
  AES-256-GCM (or ChaCha20-Poly1305) with an Argon2id-derived key and a
  self-describing, authenticated file format. This package installs the
  `paladin-gtk` application, its desktop entry, icon, and AppStream metainfo.

contents:
  - src: ./target/release/paladin-gtk
    dst: /usr/bin/paladin-gtk
    file_info:
      mode: 0755
  - src: ./data/org.paladin.Gtk.desktop
    dst: /usr/share/applications/org.paladin.Gtk.desktop
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/scalable/apps/org.paladin.Gtk.svg
    dst: /usr/share/icons/hicolor/scalable/apps/org.paladin.Gtk.svg
    file_info:
      mode: 0644
  - src: ./data/org.paladin.Gtk.metainfo.xml
    dst: /usr/share/metainfo/org.paladin.Gtk.metainfo.xml
    file_info:
      mode: 0644

# nfpm does not derive shared-library dependencies; declare the GTK runtime
# per packager (Debian/Ubuntu vs Fedora/RHEL use different package names).
overrides:
  deb:
    depends:
      - libc6
      - libgtk-4-1
      - libadwaita-1-0
  rpm:
    depends:
      - glibc
      - gtk4
      - libadwaita
